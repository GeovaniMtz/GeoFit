name: geolift
description: "GeoLift — rutinas, pesos, progreso y sugerencias de mejora para tu entrenamiento."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Persistencia local (SQLite relacional)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Navegación
  go_router: ^14.2.0

  # Transiciones (Material Motion: fade through, shared axis, container transform)
  animations: ^2.0.11

  # Gráficas de progreso
  fl_chart: ^0.68.0

  # Fechas
  intl: ^0.19.0

  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.0

  # Escanear una rutina con la cámara (OCR on-device, sin depender de
  # internet ni mandar la foto a un servidor)
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.20.0
  flutter_native_splash: ^2.4.8

flutter_native_splash:
  color: "#141210"
  image: assets/branding/splash_logo.png
  android_12:
    image: assets/branding/splash_logo_android12.png
    icon_background_color: "#141210"
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: true

  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Variable.ttf
          weight: 500
        - asset: assets/fonts/Oswald-Variable.ttf
          weight: 600
        - asset: assets/fonts/Oswald-Variable.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 800
